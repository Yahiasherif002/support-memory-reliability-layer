[project]
name = "support-memory-reliability-layer"
version = "0.1.0"
description = "Event-sourced memory & reliability layer for an AI support assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
pythonpath = ["."]
filterwarnings = [
    # Starlette's TestClient warns about a future httpx rename; not our concern.
    "ignore:Using `httpx` with `starlette.testclient`",
]
